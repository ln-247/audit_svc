include: #подключим готовые задачи из проекта demo/templates, который создал bootstrap
  - project: demo/templates
    ref: main
    file:
      - pipelines/python_poetry_docker.yml

variables:
  POETRY_VERSION: "2.5.1"
  DOCKERFILE: "Dockerfile"

.script__poetry_install:
  - pip install --quiet "poetry==$POETRY_VERSION" "poetry-plugin-export==1.10.0"
  - poetry install --no-interaction

Deploy Job: #запускает плейбук развёртывания audit-svc      
  stage: deploy
  environment:
    name: production
    url: http://localhost:8088
  tags:
    - deploy
  variables:
    GIT_STRATEGY: fetch #чтобы раннер получил исходники вместе с папкой deploy/ , скачать репозиторий с плейбуком
  needs:
    - job: Publish Package
      artifacts: false #не скачивать файлы, которые задача Publish Package сохранила как артефакты
  rules: #разрешить запуск только на защищенном теге 
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - cd deploy
    - ansible-galaxy collection install -r requirements.yml
    - ansible-playbook audit-svc.play.yml --vault-password-file "$ANSIBLE_VAULT_PASSWORD_FILE" -e "release_tag=$CI_COMMIT_TAG"

Publish Package:
  script:
    - |
      test -n "$IMAGE_TAG"
      b64_auth=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_HOST" "$b64_auth" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --cache=false
      --reproducible
      --skip-unused-stages
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE"
      --destination "$HARBOR_IMAGE:$IMAGE_TAG"
    - |
      if [ -n "${IMAGE_OUTPUT_DOTENV_KEY:-}" ]; then
        key=$(printf '%s' "$IMAGE_OUTPUT_DOTENV_KEY" | tr '-' '_')
        printf '%s_IMAGE=%s\n' "$key" "$HARBOR_IMAGE:$IMAGE_TAG" > "$IMAGE_OUTPUT_DOTENV_FILE"
      fi