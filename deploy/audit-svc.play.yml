- name: Run PostgreSQL
  hosts: deploy-vm

  vars:
    audit_image: "harbor.localtest.me:8443/demo/audit-svc:{{ release_tag }}"

  tasks:
    - name: Create PostgreSQL data volume
      community.docker.docker_volume:
        name: audit_postgres_data
        state: present

    - name: Start PostgreSQL container
      community.docker.docker_container:
        name: audit-postgres
        image: postgres:17
        state: started
        env:
          POSTGRES_PASSWORD: "{{ postgres_admin_password | string }}"
        volumes:
          - audit_postgres_data:/var/lib/postgresql/data
      register: postgres_container
      no_log: true

    - name: Wait for PostgreSQL #проверка готов ли PostgreSQL принимать подключения
      ansible.builtin.command:
        cmd: docker exec audit-postgres pg_isready -h 127.0.0.1 -U postgres -d postgres
      register: postgres_ready
      until: postgres_ready.rc == 0
      retries: 20
      delay: 2
      changed_when: false

    - name: Create PostgreSQL user
      community.postgresql.postgresql_user:
        name: audit_svc
        password: "{{ audit_svc_password | string }}"
        state: present
        login_host: "{{ postgres_container.container.NetworkSettings.Networks.bridge.IPAddress }}"
        login_user: postgres
        login_password: "{{ postgres_admin_password | string }}"
      no_log: true

    - name: Create database
      community.postgresql.postgresql_db:
        name: audit
        owner: audit_svc
        state: present
        login_host: "{{ postgres_container.container.NetworkSettings.Networks.bridge.IPAddress }}"
        login_user: postgres
        login_password: "{{ postgres_admin_password | string }}"
      no_log: true

    - name: Create audit-svc config directory
      become: true
      ansible.builtin.file:
        path: /data/audit-svc/config
        state: directory
        owner: "65534"
        group: "65534"
        mode: "0750"

    - name: Create audit-svc config
      become: true
      ansible.builtin.template:
        src: templates/config.yaml.j2
        dest: /data/audit-svc/config/config.yaml
        owner: "65534" #пользователь nobody
        group: "65534"
        mode: "0600"
      no_log: true
      notify: Reload audit-svc
    
    - name: Run database migrations
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --entrypoint migrate
          --volume /data/audit-svc/config:/etc/audit-svc:ro
          {{ audit_image }}
      register: migration_result
      changed_when: "'done: 0 applied,' not in migration_result.stderr"

    - name: Start audit-svc
      community.docker.docker_container:
        name: audit-svc
        image: "{{ audit_image }}"
        image_name_mismatch: ignore #позволяет оставить контейнер работающим, если поменялся только тег, а сам образ одинаковый
        state: started
        volumes:
          - /data/audit-svc/config:/etc/audit-svc:ro
      register: audit_container

    - name: Apply config changes #выполняет ожидающий хендлер перед проверкой готовности
      ansible.builtin.meta: flush_handlers

    - name: Wait for audit-svc
      ansible.builtin.uri:
        url: "http://{{ audit_container.container.NetworkSettings.Networks.bridge.IPAddress }}:8080/healthz"
        status_code: 200
      register: audit_health
      until: audit_health.status == 200 #ответ 200 означает, что сервис работает и видит PostgreSQL
      retries: 20
      delay: 2
      changed_when: false

  handlers: #отправляет HTTP-запрос внутри deploy-vm
    - name: Reload audit-svc
      ansible.builtin.uri:
        url: "http://{{ audit_container.container.NetworkSettings.Networks.bridge.IPAddress }}:8080/reload"
        method: POST
        status_code: 200
      register: audit_reload
      until: audit_reload.status == 200
      retries: 20
      delay: 2
      changed_when: audit_reload.json.changed | default(false)