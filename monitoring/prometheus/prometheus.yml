global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: audit-svc
    metrics_path: /metrics
    static_configs:
      - targets:
          - deploy-vm:8080

  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets:
          - deploy-vm:9113